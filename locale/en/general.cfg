[disease-description]
limb-loss=This poor soul lost a limb.
broken-bone=A bone fractured. So there's like two or more bone parts where there used to be just one.
burnt-skin=Painfully damaged skin caused by heat, friction, cold or chemicals.
deep-cuts=Deeper and bloodier than a paper cut.
biter-bite=A biter did... well, what it's named after.
joint-dislocation=Two bones, which normally are connected with a joint, ... aren't connected anymore.
hematoma=A black eye. But most of the time at another body part.
head-trauma=A hard knock to the head. The skull held, but what's inside needs time, rest and careful monitoring.
train-collision=Looked both ways. Forgot about the third way. The classic.\n\n[color=#a7842c](Note: "Train collision" is the established medical term for this kind of injury. It also covers collisions with cars, carts, falling pianos and any other large moving object.)[/color]
spitter-acid-burns=A spitter aimed well. Its acid keeps working long after the hit, so the wound needs neutralising, not just bandaging.

rare-cold=A viral infectious disease caused by a wide variety of rhinoviruses. It can be recognized by walky, runny or sprinty noses.
weak-heart=Not to be overly specific: the heart is supposed to pump blood constantly. But this one struggles quite a bit with that task.
yeast-infection=Yeast bacteria populating this poor soul's skin.
riverhorse-like-flu=Symptoms that resemble those of the riverhorse flu. Spreads from huwan to huwan, but not nearly as eagerly as the real one.
purple-pox=Covers the skin in itchy purple spots. Prof. Dr. Purple always insisted that the name is a coincidence. Whoever had it once never gets it again.
whooping-cough=A stubborn cough that lingers for many days and spreads with every fit. Surviving it protects for a long time, but not forever.
headaches=Longer lasting headaches, making every act a burden.
diarrhea=We don't like to talk about it.
exhaustion=Sometimes people just need a break and do nothing productive to load up their inner battery. They called in sick as an excuse to not be seen as lazy. But really they likely sit at home playing the latest video game.
kidney-stone=Mineral salts that crystallize in the urinary tract. Normally they get flushed out without a problem, but sometimes they stay and can cause a sharp pain if they grow too big.

depression=This poor soul's brain produces way too less serotonin, which results in low moods, lacking energy and loss of interest.
reality-loss=This poor soul thinks that it is not real, but just a statistical number in a video game.
factorio-addiction=Once you boot up the popular video game factorio, there is no going back.
schizophrenia=This poor soul suffers from continuous psychosis with symptoms like hearing voices, paranoia or a loss of perception.
burnout=This soul is in a state of great mental exhaustion from their work or occupation.

gender-dysphoria=This person doesn't identify with the gender they were assigned at birth, which causes them to feel disconnected from their body. They are requesting sex reassignment treatment to help them in their transition.\n[color=#a7842c](Note: Being trans is neither a disorder, nor wrong in any other form.)[/color]
lack-of-purple-blood-cells=Huwan blood normally has so called Purple Blood Cells, which really are rather green when observed under a microscope. The name is because they were discovered by Prof. Dr. Purple. These cells assist the transport of oxygen.\n\nSometimes huwans are born without any at all. They can survive like this, but are extremely easily exhausted. A simple transfusion of healthy blood primes the blood with PBC.
huntingtons=A genetic, inherited disease which causes a gradual loss of all mental abilities and ends fatal.
premature-hatch-syndrome=A premature birth, most likely caused by a faulty egg. This huwan is born with an underdeveloped body, a smaller stature and weaker musculature.
environmental-allergy=This huwan's immune system never quite accepted Nauvis as home. Spores, plant matter, and airborne particles trigger a constant low-grade allergic response. Manageable - but never cured without ongoing antihistamine intake.
autoimmune-joint-disease=The immune system is attacking the body's own joint tissue, causing chronic inflammation and steady cartilage degradation. The joints stiffen, swell, and eventually fail. The condition can enter remission, but the odds aren't good.
engineer-syndrome=This huwan was born with a fragment of The Engineer's genome. They work tirelessly and cannot rest while a single belt is unbalanced. Impressive output - until the body gives up.
purple-surplus=The opposite of a lack of Purple Blood Cells: far too many of them. All that oxygen makes this huwan restless and seemingly tireless, but the thickened blood wears out the heart.
hemophilia=An inherited condition in which the blood doesn't clot properly. Every small cut becomes a big deal, so this huwan has to be very careful at work.
sickle-cell-disease=An inherited condition that deforms the blood cells, so they carry less oxygen and get stuck in narrow vessels. Comes with painful crises.
mirror-metabolism=Some of this huwan's enzymes were built mirror-inverted, so they only work on half of the molecules in normal food. A full plate leaves them half-fed.

lung-infection=The lung is infected with bacteria. They are acting like jerks by killing the lung cells.
necrosis=Dying, bacteria-infested body cells.
anaphylaxis=A severe, whole-body allergic reaction. The airways constrict, blood pressure drops, and the body begins to shut down. Without immediate treatment, fatal within the day.
sepsis=The body's defense against an infection got out of hand and now harms the body itself. Needs intensive care, fast.
severe-burns=Burns that cover too much skin to heal on their own. The patient needs fluids, pain relief and a lot of bandages.
respiratory-failure=The breathing muscles have stopped doing their job. Machines and an antitoxin take over until they do again.
vector-rejection=The immune system mistook the gene therapy's carrier virus for an intruder and overreacted. Gene therapy is still a young field.

real-riverhorse-flu=A stronger variant of the flu; stems from riverhorses.
tetanus=Sometimes a dirty wound brings along a toxin that cramps the muscles. Needs intensive care and antitoxin. Surviving it doesn't protect against the next time - only a vaccination does.

food-allergy=This huwan's immune system reacts badly to proteins in the local food supply. Usually manageable, but a bad episode can spiral quickly.
allergic-reaction=An acute reaction to a workplace allergen - dust, particulates, or organic material encountered on the job.
repetitive-strain-injury=This huwan's body has developed opinions about doing the same thing eight hours a day.
chemical-sensitivity=Repeated exposure to solvents, reagents, or airborne compounds has sensitized the immune system. What used to be harmless is now a trigger.
caffeine-overload=One more cup, and the next report will write itself. Highly productive and jittery, until the body objects.

nausea=Queasiness from too much time on water and not enough time on solid ground.
sunburn=Skin that soaked up more of Nauvis's sun than was wise. Hurts to touch.
skin-cancer=Uncontrolled abnormal cell growth in the skin, caused by excessive UV radiation over time.
animal-scratch=A scratch from a fin, tooth or claw. Should probably be disinfected.
gastroenteritis=An upset stomach and gut, caught from contaminated water. Not great.
cholera=A bacterial infection from contaminated water that drains the body of fluids very quickly.
giardiasis=A tiny gut parasite from contaminated water, also known as beaver fever. Nobody asked the beavers.
heavy-metal-poisoning=Metals dissolved in the drinking water build up in the body over time - until the dose made the poison.
swimmers-itch=Microscopic parasitic larvae burrowed into the skin. Terribly itchy.

malnutrition=This poor soul isn't getting enough to eat. They feel weak and tired and have trouble concentrating.
severe-malnutrition=This poor soul is severely malnourished from the lack of available food. They feel faint and their body is wasting away.
extreme-malnutrition=This poor soul is extremely malnourished from the lack of available food. Their condition is very life-threatening.

dehydration=This poor soul is dehydrated from the lack of available drinking water. They feel dizzy and tired and their eyes appear sunken.
severe-dehydration=This poor soul is severily dehydrated from the lack of available drinking water. They feel faint and struggle to remain conscious.
extreme-dehydration=This poor soul is extremely dehydrated from the lack of available drinking water. Their condition is very life-threatening.

food-poisoning=Something on the plate wasn't as fresh as it looked.
salmonella=A bacterial infection, usually from undercooked meat or eggs.
botulism=A toxin made by bacteria that thrive in badly preserved food. It weakens the muscles, so it demands an antitoxin quickly.
listeriosis=A bacterial infection from contaminated fish, meat or wild produce. These bacteria don't mind the cold, so even good storage doesn't stop them.
hepatitis-a=A viral infection of the liver, spread by contaminated food and water. Slow to shake off, but it usually heals completely.
ergotism=A fungus that grows on grain causes strange visions. Historically blamed on everything from witches to badly configured assemblers.

