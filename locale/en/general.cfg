[eating-behavior]
health_conscious=Health-conscious
mixed=Mixed
foodie=Foodie

[eating-behavior-description]
health_conscious=Eats for health, not for pleasure: picks every food that adds a new nutrient, favouring preferred flavours. Gets a happiness bonus for each covered nutrient. Eats disliked food only if it is the only way to cover an essential nutrient.
mixed=Always eats all preferred foods, then fills their diet to a minimum variety with neutral options. Will eat disliked food as a last resort if it is the only way to cover a nutritional need.
foodie=Eats all preferred and neutral foods unconditionally, regardless of nutritional value. Refuses disliked food no matter what.

