[nutrition-tag-description]
protein_rich=Building material for muscles, organs and pretty much everything else.
fat_rich=Dense energy storage. Also makes everything taste better.
carb_rich=Quick energy. The brain runs on it.
vitamin_rich=Small molecules with big responsibilities. Huwans can't make them themselves.
fiber_rich=Keeps the digestion going.
mineral_rich=Huwans need plenty of these, mostly calcium for their eggshells. Inhabitants who get enough of them lay eggs a bit more often.
lucidin_rich=A huwan neurotransmitter precursor that filters out the static in their heads. Plants produce it as a bitter defense compound, which is why everything rich in it tastes awful.
purpurin_rich=The building block of Purple Blood Cells. Just like them, it is actually green.
ovolin_rich=Lets the huwan body turn calcium into eggshells. Inhabitants who get enough of it have a better metabolic balance and lay eggs more often.

